<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="DEVSite builds custom Java, Spring Boot and Next.js applications, REST APIs, microservices, cloud-native solutions, Kubernetes infrastructure and scalable enterprise software.">
  <meta name="keywords" content="software development, backend development, Java, Spring Boot, API development, microservices, Flutter, web applications, mobile app backend, kafka, infrastructure, kubernetes">

  <!-- Open Graph / social sharing -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="DEVSITE — Custom Software & Backend Development">
  <meta property="og:description" content="DEVSite builds custom Java, Spring Boot and Next.js applications, REST APIs, microservices, cloud-native solutions, Kubernetes infrastructure and scalable enterprise software.">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="DEVSITE — Custom Software & Backend Development">
  <meta name="twitter:description" content="DEVSite builds custom Java, I alreadSpring Boot and Next.js applications, REST APIs, microservices, cloud-native solutions, Kubernetes infrastructure and scalable enterprise software.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Devsite">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon (browser tab logo) -->
  <link rel="icon" type="image/png" href="dev.png"/>
  <link rel="shortcut icon" type="image/png" href="dev.png"/>

  <title>DEVSITE — Custom Software &amp;Development</title>
  <link rel="manifest" href="manifest.json">

  <script>
    // The value below is injected by flutter build, do not touch.
    var serviceWorkerVersion = null;
  </script>
  <!-- This script adds the flutter initialization JS code -->
  <script src="flutter.js" defer></script>
</head>
<body>
<style>
    body {
      background-color: #00000000;
      height: 100vh;
      width: 100vw;
      position: fixed;
      inset: 0px;
      overflow: hidden;
      padding: 0px;
      margin: 0px;
      user-select: none;
      touch-action: none;
    }

    .background-with-svg {
        background-image: url('dev-logo.svg');
        background-repeat: no-repeat;
        background-position: center center; /* Center the image horizontally and vertically */
        background-size: contain; /* Scale the image to fit the div while maintaining aspect ratio */
        width: 100px;
        height: 100px;
    }

    .main-content {
      height: 100%;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity .4s ease-out;
    }

    img {
      width: 100px;
      height: 100px;
      position: absolute;
    }

    p {
      color: #fff;
    }


    .loader {
      position: relative;
      width: 250px;
      height: 250px;
      border-radius: 50%;
      background: linear-gradient(#ffd33b, #03BFB5, #949494);
      animation: animate 1.2s linear infinite;
    }

    @keyframes animate {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    .loader span {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 60%;
      background: linear-gradient(#ffd33b, #03BFB5, #949494);
    }

    .loader span:nth-child(1) {
      filter: blur(5px);
    }

    .loader span:nth-child(2) {
      filter: blur(10px);
    }

    .loader span:nth-child(3) {
      filter: blur(25px);
    }

    .loader span:nth-child(4) {
      filter: blur(50px);
    }

    .loader:after {
      content: '';
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      bottom: 10px;
      background: #191919;
      border-radius: 50%;
    }
  </style>
  <script>
     function delay(time) {
      return new Promise(resolve => setTimeout(resolve, time));
    }

    window.addEventListener('load', function(ev) {
      var loaderContent = document.querySelector('#loader-content');
      // Download main.dart.js
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: serviceWorkerVersion,
        },
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine().then(function(appRunner) {
             loaderContent.style.opacity = "0";
             //await delay(400);
             appRunner.runApp();
          });
        }
      });
    });
  </script>
    <div class="main-content" id="loader-content">
        <div class="loader">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
        </div>
        <img src="dev.png" />
    </div>
</body>
</html>
