name: Deploy to Firebase

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          dart-version: '3.2.3' # Ensure compatibility with pubspec.yaml Dart SDK constraints

      - name: Verify Dart Version
        run: dart --version

      - name: Install Flutter
        uses: subosito/flutter-action@v1
        with:
          flutter-version: '3.10.6'  # Specify a Flutter version compatible with your project

      - name: Install dependencies
        run: flutter pub get

      - name: Generate ENV Variables
        run: |
          echo "const EMAIL_PUBLIC_KEY = '${{ secrets.EMAIL_PUBLIC_KEY }}';" >> lib/application/env.dart
          echo "const EMAIL_SERVICE_ID = '${{ secrets.EMAIL_SERVICE_ID }}';" >> lib/application/env.dart
          echo "const EMAIL_TEMPLATE_ID = '${{ secrets.EMAIL_TEMPLATE_ID }}';" >> lib/application/env.dart

      - name: Build Web
        run: flutter build web --release -dart-define=FLUTTER_WEB_USE_SKIA=false

      - name: Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEVSITE_WEB_398312 }}'
          channelId: live
          projectId: devsite-web-398312