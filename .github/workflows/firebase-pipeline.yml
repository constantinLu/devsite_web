name: Deploy to Firebase

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.44.5' # Keep in sync with the local Flutter version

      - name: Verify versions
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Generate ENV Variables
        run: |
          echo "const EMAIL_PUBLIC_KEY = '${{ secrets.EMAIL_PUBLIC_KEY }}';" >> lib/application/env.dart
          echo "const EMAIL_SERVICE_ID = '${{ secrets.EMAIL_SERVICE_ID }}';" >> lib/application/env.dart
          echo "const EMAIL_TEMPLATE_ID = '${{ secrets.EMAIL_TEMPLATE_ID }}';" >> lib/application/env.dart


      - name: Build Web
        run: flutter build web --release

      - name: Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEVSITE_WEB_398312 }}'
          channelId: live
          projectId: devsite-web-398312