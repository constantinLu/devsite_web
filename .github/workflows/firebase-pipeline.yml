# https://github.com/firebase/firebase-tools

name: Deploy to Firebase

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2  # Changed from v3 to v2 as v3 is not yet released at the time of my last update

      - name: Setup Flutter
        uses: subosito/flutter-action@v1
        with:
          flutter-version: '3.10.6'  # Make sure this version exists; otherwise, use 'stable' or a specific version

      - name: Install dependencies
        run: flutter pub get

      - name: Generate ENV Variables
        run: |
          echo "const EMAIL_PUBLIC_KEY = '${{ secrets.EMAIL_PUBLIC_KEY }}';" >> lib/application/env.dart
          echo "const EMAIL_SERVICE_ID = '${{ secrets.EMAIL_SERVICE_ID }}';" >> lib/application/env.dart
          echo "const EMAIL_TEMPLATE_ID = '${{ secrets.EMAIL_TEMPLATE_ID }}';" >> lib/application/env.dart

      - name: Build Web
        run: flutter build web --release --web-renderer canvaskit --no-tree-shake-icons

      - name: Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEVSITE_WEB_398312 }}'
          channelId: live
          projectId: devsite-web-398312
